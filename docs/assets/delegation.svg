<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Delegation flow</title>
  <desc id="desc">Exact tasks go to scripts. Bounded and verifiable tasks go through Hermes to Codex for verification.</desc>
  <style>
    .box { fill: #fff; stroke: #57606a; stroke-width: 1.25; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.25; }
    .arrow { fill: #57606a; }
    text { fill: #1f2328; font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font-size: 12px; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0d1117; stroke: #8c959f; }
      .line { stroke: #8c959f; }
      .arrow { fill: #8c959f; }
      text { fill: #f0f6fc; }
      .small { fill: #8c959f; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 8 4 0 8z"/>
    </marker>
  </defs>
  <rect class="box" x="24" y="68" width="84" height="40"/>
  <text x="66" y="93" text-anchor="middle">task</text>
  <path class="line" d="M108 88H154V42H260" marker-end="url(#arrow)"/>
  <text class="small" x="166" y="32">exact?</text>
  <rect class="box" x="261" y="22" width="104" height="40"/>
  <text x="313" y="47" text-anchor="middle">script</text>
  <path class="line" d="M154 88V137H260" marker-end="url(#arrow)"/>
  <text class="small" x="166" y="112">bounded +</text>
  <text class="small" x="166" y="126">verifiable?</text>
  <rect class="box" x="261" y="117" width="112" height="40"/>
  <text x="317" y="142" text-anchor="middle">Hermes</text>
  <path class="line" d="M373 137H536" marker-end="url(#arrow)"/>
  <text class="small" x="454" y="127" text-anchor="middle">evidence</text>
  <rect class="box" x="537" y="117" width="112" height="40"/>
  <text x="593" y="142" text-anchor="middle">Codex</text>
  <text class="small" x="593" y="172" text-anchor="middle">verify</text>
</svg>
