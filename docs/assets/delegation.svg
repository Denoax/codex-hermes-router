<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title desc">
  <title id="title">Codex and Hermes delegation flow</title>
  <desc id="desc">A task reaches Codex. Codex uses a tool for exact work or delegates bounded work to Hermes, which returns evidence for Codex to verify.</desc>
  <style>
    .box { fill: #fff; stroke: #57606a; stroke-width: 1.25; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.25; }
    .arrow { fill: #57606a; }
    text { fill: #1f2328; font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font-size: 12px; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0d1117; stroke: #8c959f; }
      .line { stroke: #8c959f; }
      .arrow { fill: #8c959f; }
      text { fill: #f0f6fc; }
      .small { fill: #8c959f; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 8 4 0 8z"/>
    </marker>
  </defs>
  <rect class="box" x="22" y="78" width="92" height="44"/>
  <text x="68" y="105" text-anchor="middle">task</text>
  <path class="line" d="M114 100H188" marker-end="url(#arrow)"/>
  <rect class="box" x="189" y="78" width="120" height="44"/>
  <text x="249" y="105" text-anchor="middle">Codex</text>
  <text class="small" x="238" y="140" text-anchor="end">decides + verifies</text>
  <path class="line" d="M309 91H372V39H484" marker-end="url(#arrow)"/>
  <text class="small" x="386" y="29">exact</text>
  <rect class="box" x="485" y="18" width="116" height="42"/>
  <text x="543" y="44" text-anchor="middle">tool</text>
  <path class="line" d="M309 109H372V120H484" marker-end="url(#arrow)"/>
  <text class="small" x="386" y="109">delegate</text>
  <rect class="box" x="485" y="99" width="116" height="42"/>
  <text x="543" y="125" text-anchor="middle">Hermes</text>
  <path class="line" d="M543 141V174H249V123" marker-end="url(#arrow)"/>
  <text class="small" x="396" y="165" text-anchor="middle">evidence</text>
</svg>
