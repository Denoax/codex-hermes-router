<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" role="img" aria-labelledby="title desc">
  <title id="title">Worker authority boundary</title>
  <desc id="desc">Codex sends a task to Hermes. Hermes returns evidence. Push, deploy, and release actions are blocked.</desc>
  <style>
    .box { fill: #fff; stroke: #57606a; stroke-width: 1.25; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.25; }
    .arrow { fill: #57606a; }
    text { fill: #1f2328; font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font-size: 12px; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0d1117; stroke: #8c959f; }
      .line { stroke: #8c959f; }
      .arrow { fill: #8c959f; }
      text { fill: #f0f6fc; }
      .small { fill: #8c959f; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 8 4 0 8z"/>
    </marker>
  </defs>
  <rect class="box" x="74" y="25" width="120" height="44"/>
  <text x="134" y="52" text-anchor="middle">Codex</text>
  <rect class="box" x="486" y="25" width="120" height="44"/>
  <text x="546" y="52" text-anchor="middle">Hermes</text>
  <path class="line" d="M194 38H486" marker-end="url(#arrow)"/>
  <text class="small" x="340" y="28" text-anchor="middle">task</text>
  <path class="line" d="M546 69V96H134V69" marker-end="url(#arrow)"/>
  <text class="small" x="340" y="88" text-anchor="middle">evidence</text>
  <text x="340" y="130" text-anchor="middle">scout · research · review · prototype</text>
  <text class="small" x="340" y="158" text-anchor="middle">blocked: push · deploy · release</text>
</svg>
