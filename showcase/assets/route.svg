<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260"
 role="img" aria-labelledby="title desc">
<title id="title">Delegation route</title>
<desc id="desc">A task reaches Codex. Codex uses a tool for exact work, delegates bounded work to Hermes, or keeps the work. Hermes returns evidence to Codex.</desc>
<style>
  .bg { fill:#080808; }
  .fg { fill:#f4f4f4; }
  .muted { fill:#8a8a8a; }
  .line { stroke:#8a8a8a; stroke-width:1.2; fill:none; }
  .box { fill:none; stroke:#5f5f5f; stroke-width:1; }
  .txt { font:500 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .micro { font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; letter-spacing:.8px; }
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path fill="#8a8a8a" d="M0 0 8 4 0 8z"/>
  </marker>
</defs>
<rect class="bg" width="1100" height="260"/>
<text class="micro muted" x="48" y="42">ROUTING CONTRACT</text>

<rect class="box" x="48" y="96" width="116" height="48"/>
<text class="txt fg" x="106" y="126" text-anchor="middle">task</text>
<path class="line" d="M164 120H266" marker-end="url(#a)"/>

<rect class="box" x="268" y="96" width="140" height="48"/>
<text class="txt fg" x="338" y="126" text-anchor="middle">Codex</text>
<text class="micro muted" x="338" y="166" text-anchor="middle">DECIDES</text>

<path class="line" d="M408 108H506V70H602" marker-end="url(#a)"/>
<text class="micro muted" x="512" y="58">EXACT</text>
<rect class="box" x="604" y="46" width="132" height="48"/>
<text class="txt fg" x="670" y="76" text-anchor="middle">tool</text>

<path class="line" d="M408 132H506V190H602" marker-end="url(#a)"/>
<text class="micro muted" x="512" y="178">BOUNDED</text>
<rect class="box" x="604" y="166" width="132" height="48"/>
<text class="txt fg" x="670" y="196" text-anchor="middle">Hermes</text>
<text class="micro muted" x="670" y="236" text-anchor="middle">WORKS</text>

<path class="line" d="M736 190H888V144" marker-end="url(#a)"/>
<text class="micro muted" x="805" y="180" text-anchor="middle">EVIDENCE</text>
<rect class="box" x="890" y="96" width="148" height="48"/>
<text class="txt fg" x="964" y="126" text-anchor="middle">Codex</text>
<text class="micro muted" x="964" y="166" text-anchor="middle">VERIFIES</text>
</svg>
